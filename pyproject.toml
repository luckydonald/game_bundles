[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "game-collections"
version = "0.1.0"
description = "Maintain portable game lists and synchronize eligible launcher collections."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28,<1",
    "markdownify>=1.2,<2",
    "patchright>=1.55,<2",
    "pydantic>=2.12,<3",
    "PyYAML>=6.0.2,<7",
    "typer>=0.16,<1",
    "vdf>=3.4,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<10",
]

[project.scripts]
game-collections = "game_collections.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/game_collections"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
