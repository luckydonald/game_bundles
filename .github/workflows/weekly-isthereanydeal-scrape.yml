name: Weekly isthereanydeal scrape

on:
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  UV_CACHE_DIR: /tmp/uv-cache
  BRANCH_NAME: automation/isthereanydeal-weekly-scrape

jobs:
  scrape:
    name: Scrape isthereanydeal and open/update PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --extra test

      - name: Resolve rolling scrape branch
        run: |
          git fetch origin "${BRANCH_NAME}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH_NAME}"; then
            git checkout -B "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
            if git rebase origin/mane; then
              echo "Rebased ${BRANCH_NAME} onto origin/mane."
            else
              echo "::warning::Rebase of ${BRANCH_NAME} onto origin/mane failed, aborting rebase. Continuing on the branch as-is; a human will resolve this on the open PR."
              git rebase --abort
            fi
          else
            git checkout -B "${BRANCH_NAME}" origin/mane
          fi

      - name: Run isthereanydeal crawler
        id: crawl
        run: |
          set +e
          uv run game-collections scrape isthereanydeal --tab=live | tee /tmp/scrape-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          unresolved=$(grep -c 'unresolved:source:isthereanydeal:' /tmp/scrape-output.txt || true)
          echo "unresolved_count=${unresolved:-0}" >> "$GITHUB_OUTPUT"
          if [ "${rc}" -ne 0 ]; then
            echo "::warning::game-collections scrape isthereanydeal exited with code ${rc} (unresolved games and/or crawl errors). Committing whatever it produced anyway; a human resolves the rest via 'game-collections complete'."
          fi

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- lists/ archives/isthereanydeal)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit results
        if: steps.changes.outputs.has_changes == 'true'
        env:
          UNRESOLVED_COUNT: ${{ steps.crawl.outputs.unresolved_count }}
        run: |
          git config user.name "Lucky Lucy (automation)"
          git config user.email "3._.code@luckydonald.de"

          if [ "${UNRESOLVED_COUNT}" -gt 0 ]; then
            unresolved_line="${UNRESOLVED_COUNT} unresolved storefront IDs left as \`unresolved:source:isthereanydeal:<slug>\` for manual \`game-collections complete\` follow-up."
          else
            unresolved_line="None unresolved."
          fi

          {
            echo "[isthereanydeal] weekly scrape: ai: Run: Archived this week's isthereanydeal.com bundles via scheduled CI."
            echo ""
            echo "Automated \`game-collections scrape isthereanydeal --tab=live\` run from the weekly GitHub Actions workflow (run ${GITHUB_RUN_ID})."
            echo "${unresolved_line}"
          } > ai/git/pending-commit.md

          git add lists/ archives/isthereanydeal
          git commit -F ai/git/pending-commit.md
          git push --force-with-lease origin "${BRANCH_NAME}"

      - name: Open or update pull request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UNRESOLVED_COUNT: ${{ steps.crawl.outputs.unresolved_count }}
        run: |
          existing_pr="$(gh pr list --head "${BRANCH_NAME}" --state open --json number -q '.[0].number' || true)"
          if [ -n "${existing_pr}" ]; then
            gh pr comment "${existing_pr}" --body "New offers added by this week's scrape (run ${GITHUB_RUN_ID}). Unresolved storefront IDs: ${UNRESOLVED_COUNT}."
          else
            {
              echo "Weekly automated isthereanydeal scrape."
              echo ""
              echo "Unresolved storefront IDs left for manual \`game-collections complete\` follow-up: ${UNRESOLVED_COUNT}."
            } > /tmp/pr-body.md
            gh pr create \
              --base mane \
              --head "${BRANCH_NAME}" \
              --title "[isthereanydeal] weekly scrape" \
              --body-file /tmp/pr-body.md
          fi
