",\"href\":\"/favicon.ico?favicon.3xqulvodq66-z.ico\",\"sizes\":\"32x32\",\"type\":\"image/x-icon\"}],[\"$\",\"$L62\",\"19\",{}]]\n72:T111d,<p><img src=\"https://hb-prd.imgix.net/product-media/400b0c66e80e673af1ffc58707f1512aff3fa275.avif\" alt=\"\" width=\"616\" height=\"96\"></p>\n<p>Uncover the origins of organized crime in Mafia: The Old Country, a gritty mob story set in the brutal underworld of 1900s Sicily. Fight to survive as Enzo Favara and prove your worth to the Family in this immersive third-person action-adventure set during a dangerous, unforgiving era.</p>\n<p>Enzo will do anything for a better life. After a brutal childhood of forced labor, he's ready to risk everything to become a man of honor in the Torrisi crime family.</p>\n<p>His oath to the Mafia, with all the power, temptation, and hardship it entails, is a burning reminder of this simple truth:</p>\n<p><em>Family Takes Sacrifice.</em></p>\n<p>This thrilling narrative is brought to life by stunning visuals, cinematic storytelling, and the authentic realism that the critically acclaimed Mafia series is known for. Enzo's story unfolds in a time when skill with a stiletto blade was a deadly asset, a lupara sawed-off shotgun was a go-to firearm, murderous vendettas raged for decades, and mafiosi patrolled their protection rackets on foot, horseback, or behind the wheel of turn-of-the-century motorcars.</p>\n<h2><img src=\"https://hb-prd.imgix.net/product-media/8ec0a53883771f900528efb25b6d0c3842629b04.avif\" alt=\"\" width=\"616\" height=\"105\"></h2>\n<p><video poster=\"https://hb-prd.imgix.net/product-media/ec3d430120c2029a04d4204b1e87a05a405ab5b3.avif\" autoplay=\"autoplay\" loop=\"loop\" muted=\"\" width=\"616\" height=\"214\"><source src=\"https://hb-prd.imgix.net/product-media/69d43804bc22663161004e1644d1831dd391f064.mp4\" type=\"video/mp4\"></video></p>\n<p>The rough-hewn beauty of Sicily's rugged countryside is a stark contrast to the grime of urban alleyways—but the treachery and violence of this gangland run just as deep. Rival families and their ruthless leaders wage unending turf wars in the shadows, hidden from the public eye. Trust is a fleeting rarity, and loyalties are worth killing for.</p>\n<h2><img src=\"https://hb-prd.imgix.net/product-media/cb950b43f992ade6871c1c60c259b8cce85019ac.avif\" alt=\"\" width=\"616\" height=\"72\"></h2>\n<p><video poster=\"https://hb-prd.imgix.net/product-media/43f68f478a35cc67e31714b0b085645ace40d9ea.avif\" autoplay=\"autoplay\" loop=\"loop\" muted=\"\" width=\"616\" height=\"214\"><source src=\"https://hb-prd.imgix.net/product-media/760dba80b77d8d700f9d79e1dce1ddd69022c413.mp4\" type=\"video/mp4\"></video></p>\n<p>You're the antihero of this thrilling 1900s story, living out every tense moment of Enzo's descent into Sicily’s clandestine criminal underworld. Come face-to-face with a cast of unpredictable allies and cutthroat enemies in this classic crime drama, rich in period-authentic details that will immerse you in this treacherous Mediterranean setting.</p>\n<h2><img src=\"https://hb-prd.imgix.net/product-media/7b8364917a20ece639f56af166effa9dbf5eb888.avif\" alt=\"\" width=\"616\" height=\"72\"></h2>\n<p><video poster=\"https://hb-prd.imgix.net/product-media/5f3d4c0d520a9443052189b5c79b12ca18b74cb0.avif\" autoplay=\"autoplay\" loop=\"loop\" muted=\"\" width=\"616\" height=\"214\"><source src=\"https://hb-prd.imgix.net/product-media/a4c541b8c404857b937dc7159b6b731c2513688a.mp4\" type=\"video/mp4\"></video></p>\n<p>Engage in life-or-death combat, be it up close with a blade or from afar with a variety of firearms. Ambush enemies for vicious stealth takedowns, or slice them up in close-quarters duels. If you prefer firearms, wield period-authentic handguns, rifles, and shotguns to overcome any odds and doggedly eliminate the Don's enemies.</p>\n<h2><img src=\"https://hb-prd.imgix.net/product-media/eab1f9a3d172677b3212d4218b8ade3cd4d8b139.avif\" alt=\"\" width=\"616\" height=\"72\"></h2>\n<p><video poster=\"https://hb-prd.imgix.net/product-media/cc01b8a095632088676b6c9030260d9b45f1262e.avif\" autoplay=\"autoplay\" loop=\"loop\" muted=\"\" width=\"616\" height=\"214\"><source src=\"https://hb-prd.imgix.net/product-media/ca9095adab9fe251a14f08867c43194a0ef24ba1.mp4\" type=\"video/mp4\"></video></p>\n<p>Traverse a wide range of Sicilian environments, from underground crypts and crumbling ruins to bountiful vineyards and ornate opera houses. To reach your next target or make a hurried getaway, you'll need to gallop on horseback across cobbled streets and open fields, or speed down dirt roads in authentic turn-of-the-century automobiles.</p>\n73:T1a3b,<p><b><i><font color=\"#ff9c00\">Link and verify your Battle.net account before claiming! For subscribers in China, this game is not available on Chinese battle.net and is only accessible through international battle.net for all users.</font></i></b></p><p>\n</p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/db3f101ca10ff29cfc01bf30badacc55fdbaf759.avif\" width=\"616\" height=\"346\"><source src=\"https://hb-prd.imgix.net/product-media/1cab587885f60ce8497318e120d1ca33e86c3f16.mp4\" type=\"video/mp4\"></video></span></p><p class=\"bb_paragraph\">The Outer Worlds 2 is the eagerly-awaited sequel to the award-winning first-person sci-fi RPG from Obsidian Entertainment (just look at the exciting number of dashes in this sentence!). Time to clear your calendar – get ready for an action-packed adventure with a new crew, new weapons, and new enemies in a new colony! So much newness!</p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/b6461bf3fe6ff8d0d53c50bc336997d17e0eaa96.avif\" width=\"616\" height=\"346\"><source src=\"https://hb-prd.imgix.net/product-media/64ff37f795c5ef17113a8785431677d00d5ff101.mp4\" type=\"video/mp4\"></video></span></p><p class=\"bb_paragraph\">As a daring and most likely good-looking Earth Directorate agent, you must uncover the source of devastating rifts threatening to destroy all of humanity. Your investigation leads to Arcadia, home of skip drive technology, where the fate of the colony, and ultimately the entire galaxy, rests on your decisions—your strengths, your flaws, your crew, and the factions you choose to trust.</p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/d265f567bd68ce56aeb6746f5fbb59d22b322826.avif\" width=\"616\" height=\"180\"><source src=\"https://hb-prd.imgix.net/product-media/ef499c8700e3cea76b98777e266060f58c421266.mp4\" type=\"video/mp4\"></video></span></p><p class=\"bb_paragraph\">The Arcadia colony is engulfed in a factional war, as the Protectorate’s so-called benevolent rule is challenged by the rebellion of their religious order and a corporate invasion. As destructive rifts spread across the colony, each faction fights to control or close them for their own ends. Navigate diverse zones, uncover hidden lore, and shape the fate of a system on the brink!</p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/9a691f0603521a3f9e3b30cab9d266e8d0aea77d.avif\" width=\"614\" height=\"346\"><source src=\"https://hb-prd.imgix.net/product-media/6a1a5df9916842c1e8ba53ce9b9641c66ed545f6.mp4\" type=\"video/mp4\"></video></span></p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/1e36a37241bcdcd624f08bfb66b6c63e67678c0c.avif\" width=\"616\" height=\"180\"><source src=\"https://hb-prd.imgix.net/product-media/4893464924004d877f12b22d75fb3b6a91fcfd30.mp4\" type=\"video/mp4\"></video></span></p><p class=\"bb_paragraph\">Build your character with the abilities and choices that reflect your playstyle. The colony reacts to your every move, crafting a narrative that’s yours to own—whether you’re a disciple of diplomacy, an astute strategist, a crusader for chaos, or something different altogether. And yes, you can dumb!</p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/0c76fadcdffa17cce834f08b0300654a40f6664e.avif\" width=\"616\" height=\"346\"><source src=\"https://hb-prd.imgix.net/product-media/ca0d73c446bc3cf7fcf09e66e950e0e62ff26aa6.mp4\" type=\"video/mp4\"></video></span></p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/83404cd0db802fd83c67f55c5951386cbf8f9e2d.avif\" width=\"616\" height=\"180\"><source src=\"https://hb-prd.imgix.net/product-media/9014a239267266602d34e659b84df0bfe74e5d5d.mp4\" type=\"video/mp4\"></video></span></p><p class=\"bb_paragraph\">Recruit companions with unique traits, backgrounds and goals. Whether you choose to help them achieve their ambitions or steer them toward your own objectives, your influence shapes their growth (or death), making them an integral part of the immersive story you create together.</p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/0e7b5255bbdc1a802136ad5c0aeeb835c0c13b78.avif\" width=\"616\" height=\"346\"><source src=\"https://hb-prd.imgix.net/product-media/d458918b3ed433d6a03e85e3a3fc2be39d3e8f6c.mp4\" type=\"video/mp4\"></video></span></p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><strong>High Fidelity Graphics</strong></p><p class=\"bb_paragraph\">Explore Arcadia with stunning visual detail. The Outer Worlds 2 supports true 4K resolution on compatible devices and unlocked framerates on PC, delivering smooth performance across sprawling alien landscapes, neon-lit cities, and fractured space environments.</p><p class=\"bb_paragraph\"> </p><p class=\"bb_paragraph\"><strong>Ray Tracing</strong></p><p class=\"bb_paragraph\">Ray tracing adds depth and realism across Arcadia. From glowing rift anomalies to the reflections of neon signs on rain-soaked streets, advanced lighting, shadows, and reflections create a more dynamic and immersive experience.</p><p class=\"bb_paragraph\"><strong>DLSS, FSR, and XeSS Support</strong></p><p class=\"bb_paragraph\">Play with optimized performance across the board. The Outer Worlds 2 supports NVIDIA DLSS, AMD FSR, and Intel XeSS upscaling, ensuring sharp visuals and higher frame rates no matter your GPU.</p><p class=\"bb_paragraph\"> </p><p class=\"bb_paragraph\"><strong>HDR</strong></p><p class=\"bb_paragraph\">Step into Arcadia with high dynamic range support. HDR enhances contrast and color depth across compatible displays, making every neon light, alien sky, and weapon blast more vivid and lifelike.</p><p class=\"bb_paragraph\"> </p><p class=\"bb_paragraph\"><strong>Ultra-wide Support</strong></p><p class=\"bb_paragraph\">See more of Arcadia with ultra-wide 21:9 display support. From massive corporate facilities to the vastness of space, a wider field of view delivers a more cinematic perspective on the colony’s fractured future.</p><p class=\"bb_paragraph\"></p>\n74:T450,<p>The iconic SHINOBI returns in an all-new 2D action platformer with a unique hand-drawn look created by the team behind the hit brawler Streets of Rage 4.</p>\n<p>\n Play as the legendary Shinobi Joe Musashi, master of the ninja arts. After finding your village burned to the ground and your clan turned into stone, you must set off on a quest for vengeance, ready to face an unparalleled evil and avenge your clan.\n</p>\n\n<p>\n <strong>\n  EXECUTE THE NINJA ARTS WITH PRECISION\n </strong>\n</p>\n<p>\n Wield your vast ninja arsenal including the great Katana Oborozuki, Kunai, Ninjutsu arts, and Ninpo to vanquish your foes.\n</p>\n<p>\n <strong>\n  MASTER THE WAY OF THE SHINOBI\n </strong>\n</p>\n<p>\n Unleash limitless combos with unique combat moves, acquire Amulets for enhanced abilities, and discover Ningi tools to overcome obstacles and uncover new paths.\n</p>\n<p>\n <strong>\n  JOURNEY THROUGH A STYLISTIC NEW WORLD\n </strong>\n</p>\n<p>\n Venture through more than a dozen unique and visually striking stages, from military bases to a scorching desert, challenging platforming puzzles, and hidden secrets.\n</p>\n75:Tc48,<strong>In Yakuza 6, Kazuma Kiryu will find out exactly how much people are willing to sacrifice for family</strong> - be those ties through blood or bond - when he investigates a series of shadowy events that involve the ones he holds closest to his heart. Fresh out of a three-year prison sentence, an older and weathered Kiryu comes to find out that his surrogate daughter, Haruka, has gone missing from the orphanage he looks after. The trail leads him to his old stomping grounds in Kamurocho, where he discovers that she has been struck by a car and now lies in a coma. To make matters worse, Kiryu learns that Haruka now has a son that he must look after. With baby in hand, Kiryu journeys to the seaside town of Onomichi, Hiroshima to unravel the truth about Haruka, her son, and a sinister secret that the Hiroshima yakuza are harboring.<br><br>From the unparalleled realism of the new setting of Onomichi, a beautiful, sleepy port town in Hiroshima Prefecture, to the latest evolution of Kamurocho, the biggest red-light district in Tokyo, Yakuza 6 is the ultimate iteration the game's blend of gritty crime story, hyper-explosive combat, and all the vices and distractions those locales have to offer.<br><br><strong>Enter the “Dragon Engine”</strong> - Explore the world of Yakuza like never before. Yakuza 6 is the first current-gen Yakuza title that was developed from the ground up for the current-gen hardware, introducing the seedy Japanese underworld with detailed visuals, lifelike animations, a new physics engine, interactive storefronts, seamless transitions and more.<br><br><strong>Explore Kamurocho Reborn and the Scenic Views of Onomichi</strong> - The hypnotic lights, opportunistic inhabitants, and hedonistic distractions of Kamurocho look better than ever. Revamped minigames like karaoke, batting cages, darts, hostesses, and the SEGA arcade have been streamlined for maximum pleasure, and new additions like the RIZAP Gym, Cat Café, and Clan Creator are the purrfect distractions after a long night of bashing heads! But it’s also time to get away from the hustle and bustle of city life to play tourist in beautiful Onomichi. This tranquil coastal community is home to plenty of local activities like bar mingling, spearfishing (think action-packed rail shooter … with fish), and more!<br><br><strong>Let the Bodies Hit the Floor</strong> - Yakuza 6 Kiryu is a 100% certified badass, so that means he’s a battle-hardened veteran when it comes to the art of street fighting. Although he utilizes one fighting style this time around, you best believe Kiryu hits like a truck. Devastating combos and bone-breaking Heat Actions make a return, but now the Dragon of Dojima can fill up a meter to engage Extreme Heat Mode. When activated, Kiryu glows blue and unleashes heavy-damage combos with his fists or any “tool” that’s close at hand.<br><br><strong>Fully Voiced Japanese Audio</strong> - For the first time in series history, every line and piece of dialogue is fully voiced in Japanese. Let the dramatic story and absurd humor of the series unfold like an interactive foreign film experience.\n76:Te81,<p class=\"bb_paragraph\"><strong>Crisol: Theater of Idols</strong> is a gripping survival horror adventure set in the haunting world of Hispania, a nightmarish reimagining of Spain.&nbsp;&nbsp;&nbsp;</p><p class=\"bb_paragraph\">Playing as Gabriel, a soldier who can use his own blood as a deadly weapon, you endeavor on a journey to fulfill a divine mission from the Sun God.&nbsp;&nbsp;</p><h2 class=\"bb_tag\"><u><strong>Key Features</strong></u>:&nbsp;&nbsp;</h2><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/7e6c438a12581de427314de6ed8803e8b01984ab.avif\" width=\"1170\" height=\"658\"><source src=\"https://hb-prd.imgix.net/product-media/2b046a50e561fde96b9fb0552145286e057d8122.mp4\" type=\"video/mp4\"></video></span></p><h2 class=\"bb_tag\"><strong>Explore the Cursed Island of Tormentosa&nbsp;&nbsp;</strong>&nbsp;</h2><p class=\"bb_paragraph\">Uncover the chilling history and twisted folklore of Tormentosa, a beautiful but malevolent island. Traverse eerie landscapes, crumbling grand ruins, and labyrinthine streets as you peel back the layers of cults and blood sacrifice.&nbsp;&nbsp;&nbsp;</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/f6a750150bcad9074279d85a1285a270fcc48eb2.avif\" width=\"1170\" height=\"658\"><source src=\"https://hb-prd.imgix.net/product-media/49aac1021159f909b5eb8ba769e90b9804d58dbd.mp4\" type=\"video/mp4\"></video></span></p><h2 class=\"bb_tag\"><strong>Blood is Your Weapon—and Your Curse&nbsp;&nbsp;</strong>&nbsp;</h2><p class=\"bb_paragraph\">Blood is both your lifeline and your ammunition. Wield this new-found power against terrifying enemies and solve intricate puzzles, but beware: every shot drains your life. Choose wisely—survival hinges on your ability to balance life and death.&nbsp;&nbsp;&nbsp;&nbsp;</p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/96bae4a4c0be847ba6fbf9a193faa6c7f71acff6.avif\" width=\"1170\" height=\"658\"><source src=\"https://hb-prd.imgix.net/product-media/5eb2eee8b9b271c586678984e04d511c45044d9d.mp4\" type=\"video/mp4\"></video></span></p><h2 class=\"bb_tag\"><strong>Manage Your Powers and Weapons</strong>&nbsp;</h2><p class=\"bb_paragraph\">Upgrading the powers that leverage the lethality of blood allows you to deal more damage, fight for longer, and gain bonuses in combat. Navigate myriad weapon options for the right scenario and improve them through coins found in your exploration of Tormentosa.&nbsp;&nbsp;&nbsp;</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/ce4fb77cc80349a21622c58fa7db7944c017a3ff.avif\" width=\"1170\" height=\"658\"><source src=\"https://hb-prd.imgix.net/product-media/5aa2740334668bcdeb30fbc3e2212014ce98e118.mp4\" type=\"video/mp4\"></video></span></p><h2 class=\"bb_tag\"><strong>A Story Rooted in Horror and History&nbsp;&nbsp;</strong>&nbsp;</h2><p class=\"bb_paragraph\">Hispania’s disturbing fusion of historical events, folklore, and religious undertones creates a uniquely horrifying world. Face off against staggering statues brought to life and unravel a dark narrative that blurs the line between reality and nightmare.&nbsp;&nbsp;&nbsp;</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\">Prepare to sacrifice everything. How much blood will you shed to uncover the truth?</p>\n77:T1672,<span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/72c3ec0bcf70a178e3903fab530e4e47f83fef48.avif\" width=\"616\" height=\"180\"><source src=\"https://hb-prd.imgix.net/product-media/89535179b0a101984328f283c5ef93db18e5d7be.mp4\" type=\"video/mp4\"></video></span><br><br>As you <strong>ascend</strong> from your shelter after <i>the long long years</i>, a brave new old world awaits you. A world inhabited with nasty and <strong>vile</strong> creatures. A world with no other human soul to be seen. A world with <i>nature</i> in reigns now. A world that's about to get even worse.<br><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/e10f6070c25052f6c25459075baaed03d6d49aa9.avif\" width=\"616\" height=\"370\"></span><br><br>You need to find a way to <strong>escape the wretched island</strong>. But before that, <i>enjoy the bittersweet apocalypse</i>.<br><br><ul class=\"bb_ul\"><li>💥 <i>Break</i> over 99% of all objects for materials with the right tools. No barrier will stop you.<br></li><li>🔪 <i>Fight</i> with (or run away) nasty and vile creatures of the post-apocalyptic era.<br></li><li>🌵 <i>Explore</i> the handcrafted open world and uncover its mysteries.<br></li><li>⛺ <i>Survive</i>. Clear areas of monsters and claim them as yours.<br></li><li>🔨 <i>Build</i> outposts to establish your presence.<br></li><li>💎 <i>Craft</i> permanent weapons, tools, outfits, and trinkets.<br></li><li>🐫 <i>Hunt</i> various game or tame them for your post-apocalyptic zoo ranch.<br></li><li>🌱 <i>Farm</i> nutritious plants and reap the rewards as the crop gets ripe.<br></li><li>🏆 <i>Solve puzzles</i> above ground and underground in the Tombs of the Old Ones<br></li><li>🎣 <i>Fish</i> cunning scaly things under the watery surface.<br></li><li>🍰 <i>Cook</i> delicious recipes for permanent stat and ability upgrades.<br></li><li>🗿 <i>Unravel</i> the mysteries of the strange island.</li></ul><br><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/055081e9c7e0798123064c7f73fcd75cc3647c38.avif\" width=\"616\" height=\"200\"><source src=\"https://hb-prd.imgix.net/product-media/f61dbf1a701728a5a89a630115174068283c1f62.mp4\" type=\"video/mp4\"></video></span><br><br>Explore the ruins of the past and discover technology from the hitech era. Gain technological advantage against the hostile environment. Or go deeper and recover the ancient lost knowledge from the hidden tomb chambers of the old ones. Acquire materials with almost magic-like properties and use them to craft insanely powerful gear.<br><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/8b78984fd6140526ee40192034d9ec8358cdc0f2.webp\" width=\"616\" height=\"48\"></span><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/8212d5e3720c93ffef4b2a7eca8c5946ced04a8e.avif\" width=\"616\" height=\"444\"></span><br><br>Over 99% of everything can be broken for materials with the right equipment. Do that, and collect the sweet nectar of the old world: plastics, rubber, and metals. There is a <strong>reasonable</strong> number of different materials to gather. Find <strong>Recipes</strong> to <strong>craft</strong> <strong><i>permanent</i></strong> items and upgrades.<br><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/8663acc681b39afef0b40ce69baa0a7c657eb6bc.webp\" width=\"616\" height=\"48\"></span><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/e43e314186223982b80ffd143867340bab4daf81.avif\" width=\"616\" height=\"400\"></span><br><br>Explore the vast hand-crafted open world and build <strong>Outposts</strong> to establish your presence. Claim back the land area by area. Find hidden treasures and solve puzzles long ago forgotten. Find your means of escaping the island.<br><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/2540f190421156a06bb420233dea5b7f3ccdf3b6.webp\" width=\"616\" height=\"48\"></span><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/210382732d014f9fc3c32936d2011de00f301648.avif\" width=\"616\" height=\"424\"></span><br><br>The world after the end is inhabited by nasty creatures. Something <i>vile</i> has affected most of the wildlife and former human inhabitants of the island -- turning them into aggressive beast-like creatures. Slay them and collect their loot. Harvest their organs and provide them <i>eternal rest</i>. Or run away and come back when you're stronger. Fight using various melee and ranged weapons. Create traps and lure monsters in. Do whatever it takes.<br><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/7ac20601e74c18363f4d96bc52219d4df1a21a03.webp\" width=\"616\" height=\"57\"></span><br><br>You will not be fighting just to maintain the <i>status quo</i>. This IS NOT a game about starving. You won't be constantly looking for <i>a tasty cockroach</i> to fill your over-metabolic stomach while waiting for the unavoidable bliss that is death. You will <i><strong>never die of hunger</strong></i>. You will get more powerful, and unlock <strong>permanent upgrades</strong>. The world is a dangerous place, and you may take a few steps back once in a while, but eventually <strong>you will thrive</strong>.<br><br>Enjoy the bittersweet apocalypse.<br><br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/c6b28bb690c8280e199be82f312695549f6cdc54.avif\" width=\"616\" height=\"368\"></span>\n78:T3996,<p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/12fdcfb0d692714b4feb77d5c68244e550b54400.avif\" width=\"780\" height=\"180\"></span>Embark on a space voyage with your ragtag crew of civilians in search of a new home. <strong>Build</strong> spaceships tile by tile, <strong>create</strong> optimal gas conditions, <strong>manage</strong> the needs and moods of their crew, <strong>encounter</strong> other space-faring groups, <strong>and explore</strong> the universe in this <strong>spaceship colony sim.</strong> </p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/e71f150b6cc83ff70ce92a42efcc1ffcab871e45.avif\" width=\"780\" height=\"80\"></span><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/f841696d87a0db7d3155b2da00e8555f20e784c0.avif\" width=\"780\" height=\"440\"><source src=\"https://hb-prd.imgix.net/product-media/17afee9dde598173aedb72aaf9558e6bb831e973.mp4\" type=\"video/mp4\"></video></span><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/2188f6c9897f26face36d33f6f9ee76664b73df3.avif\" width=\"780\" height=\"150\"></span></p><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\"><strong>Customize</strong> - Complete freedom to build a spaceship or station of your own desire. Place every piece of ship hull, wall, door and facility wherever you want.  </p></li><li><p class=\"bb_paragraph\"><strong>Functional</strong> - All facilities serve a purpose. Crew members will sleep in beds, use toilets, be disturbed by a noisy room and praise you for an arcade machine. </p></li></ul><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/007472be43bbaf46387ade94266f7e57bbf22d7c.webp\" width=\"780\" height=\"46\"></span>A functional spaceship can be built <strong>tile-by tile</strong>, giving you the opportunity to shape a <strong>spaceship of your own desire</strong>. It can be symmetric and streamlined, or an asymmetrical whimsical looking thing. It does not have to look like a conventional spaceship depicted in sci-fi literature, you are free to design your own, <strong>the choice is yours!</strong> </p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/1e929c4ee3b7380f5dd6a46e1f22b5fb793ea4b1.avif\" width=\"780\" height=\"90\"></span><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/4a63e12f7dbe675fbdc7b8ea416ca67264382dc7.avif\" width=\"780\" height=\"400\"><source src=\"https://hb-prd.imgix.net/product-media/9e16758890e4cf0f4e1ae23c4413ddc0efa02661.mp4\" type=\"video/mp4\"></video></span><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/3ed03ac5b2451c0d9258a697d6593d83ab8a5871.avif\" width=\"780\" height=\"82\"></span></p><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\"><strong>Oxygen and CO2</strong> - Keep optimal Oxygen and CO2 levels by building life support modules for your crew members. </p></li><li><p class=\"bb_paragraph\"><strong>Hazardous gases</strong> - Certain facilities and explosions can release hazardous gases. Build scrubbers to purify the air. </p></li><li><p class=\"bb_paragraph\"><strong>Temperature and power</strong> - Build thermal regulators to maintain an ideal temperature for your crew. Build power nodes and set up power distribution throughout the ship. </p></li><li><p class=\"bb_paragraph\"><strong>Comfort</strong> - Building a bed right next to the ship core will disturb sleep. Design your ship for crew comfort. </p></li></ul><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/62abe1a9e5cf3f2c5f7570813f61ca58340a1b86.webp\" width=\"780\" height=\"40\"></span>The isometric tile-based gas system <strong>simulates various gases, temperature and crew comfort on your spaceship.</strong> Humans, plants and facilities react to the conditions surrounding them, giving meaning to how you design your ship and the living conditions you create. <strong>Secure facilities, optimize crew survival and well-being</strong>, but also think of possible future accidents and chaos generated from crew combat or environmental hazards. </p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/0a3b14c21f1943f6187a716e1d4757637b89f734.avif\" width=\"780\" height=\"93\"></span><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/864b103f1e181f548906cf28961d2318efb936c8.avif\" width=\"1280\" height=\"662\"></span></p><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\"><strong>Skills and traits</strong> - Every crew member has their own set of skills and traits. A wimp might get scared shooting a gun, while an iron-stomach can eat anything unaffected. </p></li><li><p class=\"bb_paragraph\"><strong>Mood</strong> - A happy crew member needs food, sleep, comfort, safety and friends. Take something away and their mood will be affected.  </p></li><li><p class=\"bb_paragraph\"><strong>Conditions</strong> - Crew members might feel adventurous, suffer from starvation, feel unhygienic, or they simply ate too much. Various conditions affect how they feel.  </p></li><li><p class=\"bb_paragraph\"><strong>Mental breaks</strong> - When the stress is too much for a crew member they may suffer a mental break. Some will vent themselves out of the air lock, while others might start a fight. </p></li></ul><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/85c72a02b1d0ce532b3490507487f5e007a72068.webp\" width=\"780\" height=\"32\"></span>In Space Haven <strong>characters aren't mere robots.</strong> The game simulates needs, moods, health and skills of your crew members and they develop relationships with each other. Their past life occupation and hobbies will affect their <strong>skills and know-how, and they have both positive and negative traits.</strong> Witness joyful moments, depression, and drama surrounding different crew members as you journey onward seeking a new home.  </p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/403ce71c7eacb8414e04757882508c0a2f4f768c.avif\" width=\"780\" height=\"114\"></span><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/29e55be96870558f26eecc433d5318181b9b932f.avif\" width=\"1280\" height=\"662\"></span></p><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\"><strong>Away missions</strong> - Equip your crew members and organize away teams to explore derelict ships or visit stations or spaceships of other factions.  </p></li><li><p class=\"bb_paragraph\"><strong>Draft</strong> - Draft and move your crew members to attack enemies and save their friends. </p></li><li><p class=\"bb_paragraph\"><strong>Inventory</strong> - Each crew member has their own unique inventory. Equip them with pistols, rifles, grenades and more. </p></li></ul><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/ecf94059c45adfa7b359244bb7b875a214454de7.webp\" width=\"780\" height=\"60\"></span>Equip your crew with space suits and weapons and <strong>organize away teams to explore derelict ships and stations.</strong> Explore and salvage resources and items; find activated cryopods with someone frozen inside. Visit spaceships or stations of other factions and find data logs telling stories of past spacefarers searching for a new home.  </p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/8f26527acdb2f5a0dad531df5ba2a7a241a5b658.avif\" width=\"780\" height=\"105\"></span><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/889c22496b45dc8ef67de4760b1ddc8b0a460344.avif\" width=\"780\" height=\"400\"><source src=\"https://hb-prd.imgix.net/product-media/269aaf1decd453a4a64d041cf9fd07265bd162c9.mp4\" type=\"video/mp4\"></video></span></p><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\"><strong>Crew combat </strong>- Engage in combat with enemy factions or an alien species.  </p></li><li><p class=\"bb_paragraph\"><strong>Aliens</strong> - Watch aliens incapacitate your crew members and capture them alive. See them suffer in the alien lair and decide if you want to try to save them or not. </p></li></ul><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/dea739225c03ad904e0d76088bc27a98d2c6692d.avif\" width=\"780\" height=\"64\"></span><strong>Aliens capture your crew members and cocoon them against walls in their base.</strong> See them suffer in the alien lair and decide if you want to save them or not. Explore derelict ships and discover someone from the original crew of the ship captured by the aliens. Events like these create interesting back stories to new arrivals to your crew. </p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/82b86686ae6e2c3bc58c700c9bb1b3178d967824.avif\" width=\"780\" height=\"111\"></span><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/994e5f0a95376fca67d1e4faf7b732719e398bff.avif\" width=\"1280\" height=\"662\"></span></p><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\"><strong>Battlestations</strong> - Watch your crew take battlestations as you engage the enemy in ship-to-ship battle. See your crew load turrets with projectiles, put out fires from explosions, patch hull breaches and repair vital facilities in the midst of battle. </p></li><li><p class=\"bb_paragraph\"><strong>Tactical</strong> - Target the enemy ship engine and stop them from fleeing. See them do the same to you. Engage their turrets directly or try to focus on the enemy ship core and see their ship go pitch black. Build shields to protect your most vital segments of your ships. </p></li></ul><p class=\"bb_paragraph\">Build turrets and engage in tactical ship-to-ship combat, <strong>where a hit and explosion could cause a snowball effect of fire, smoke, hazardous gases and even hull breaches</strong> for either party. All crew members need to work together to win the battle. </p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/9fe9344f1bc75f3d3799056bc35a0bb65e6b9a26.avif\" width=\"780\" height=\"118\"></span><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/62f27d58b8f7e6102b0ce5de839e92cd4bd739b8.avif\" width=\"1280\" height=\"662\"></span></p><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\"><strong>Cryopods</strong> - Protect your crew from side-effects of Inter-stellar travel. Place crew members into stasis to freeze the progression of a disease or to await rescue.  </p></li><li><p class=\"bb_paragraph\"><strong>Medical</strong> - Treat crew members for injuries, wounds and diseases. Medical conditions affect crew members in various ways. </p></li></ul><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/f54b7810886015d2756c22d770fd7ec3481cfb4c.avif\" width=\"780\" height=\"108\"></span>Your crew members will become wounded in battles and might catch a serious disease. Set up a medical room, scan for diseases and foreign masses and <strong>have your best doctor tend to illnesses and perform surgeries.</strong> Hope that your doctor is not absent minded and leaves a surgical tool inside. </p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/618fd6cdd08c95302fdba7648d05a3ab7f4946d7.avif\" width=\"780\" height=\"82\"></span><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/71e88e8987e07e22e3f1e86130fe824d0ee58cd9.avif\" width=\"780\" height=\"440\"></span></p><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\"><strong>Generated galaxy</strong> - Explore a new procedurally generated galaxy each playthrough, with planets, asteroids, stations and spaceships of other factions.</p></li><li><p class=\"bb_paragraph\"><strong>Factions</strong> - Interact with various factions all trying to survive and establish dominance their own way. Meet pirates, merchants, slave traders, cultists and more and develop relationships with each. <br><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/93a44d97b63d5c7e3183db4acbf5d9263d1b754f.webp\" width=\"780\" height=\"50\"></span></p></li><li><p class=\"bb_paragraph\"><strong>Resources</strong> - Mine for raw resources and refine them to building materials. Trade resources with other groups you meet.</p></li></ul><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/26d2c62373b644f21ff38280a475bdee896ddd97.webp\" width=\"780\" height=\"50\"></span>Explore a new procedurally generated galaxy each new playthrough, with various factions all trying to survive and establish dominance their own way. <strong>You'll meet pirates, slavers, merchants, cults, androids and more.</strong> Jump into hyperspace, seek out resources and meet various groups and develop your relationship with them.</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/0f08daea6e21ad84b7c136772d9d17f47ad5452a.avif\" width=\"1280\" height=\"662\"></span><strong>Cool things that can happen in Space Haven:</strong></p><p class=\"bb_paragraph\"></p><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\"> Gain a new crew member by finding a activated cryo chamber aboard a derelict ship.</p></li><li><p class=\"bb_paragraph\"> Have a space burial for your fallen crew member to let other crew members say good bye.</p></li><li><p class=\"bb_paragraph\"> Grow plants with bio mass and water recycled from toilets.</p></li><li><p class=\"bb_paragraph\"> Eat the meat from a fallen crew member or an invader if desperation is high.</p></li><li><p class=\"bb_paragraph\"> Watch aliens capture your crew member and cocoon them to a wall in their lair. Will you go save them or leave them there?</p></li></ul><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><u>Keywords:</u> space, base building, simulation, strategy, sandbox, survival, management, crafting, open world, indie, build, city builder, sci-fi, procedural, sim.</p><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><strong>Wishlist and Follow now!</strong></p>\n79:T11ed,<p class=\"bb_paragraph\"><strong>Ever dreamed of being a home owner? Welcome to the Squeakross: Home Squeak Home program!</strong> </p><p class=\"bb_paragraph\"> </p><p class=\"bb_paragraph\">You just got into a fresh new home for your tiny rodent friend, but… it’s empty! Solve puzzles from the Home Squeak Home Catalog and transform them into splendid furniture and accessories to dress it up! </p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/6b30ca88fe096f5b43aacd242136f99f926b7bf1.webp\" width=\"607\" height=\"55\"></span></p><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\"><i>Relaxing Puzzle Solving</i>: Learn how to play in 5 minutes, and solve logic-numbers puzzles <strong>at your rhythm</strong>, no time pressure. </p></li><li><p class=\"bb_paragraph\"><i>Scared of puzzles?</i> Worry not! Your rodent friend is here to help. Customize your game experience: <strong>Toggle</strong>&nbsp;<strong>hints</strong>, <strong>Solve a random cell, </strong>or use the brand new <strong>Logic-Assist system</strong> that lets you preview possible solutions!   </p></li><li><p class=\"bb_paragraph\"><i>No assistance needed?</i> You can <strong>disable</strong> all those options if you prefer to be challenged.</p></li></ul><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/8224682483326b99f2f8fa4d1103d4da1ace2bc1.avif\" width=\"616\" height=\"250\"><source src=\"https://hb-prd.imgix.net/product-media/7181b5bd6ac20d09054d6a30895694ddd49bd052.mp4\" type=\"video/mp4\"></video></span><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/4d976b7b22af0aad68d437622197388264f85624.webp\" width=\"607\" height=\"55\"></span></p><p class=\"bb_paragraph\">Our Home Squeak Home catalog features <strong>many different styles</strong> of interior decor, from basic housing supplies to extravagant ones to match a broad range of tastes. You will also find many <strong>accessories to dress </strong>your rodent friend. </p><p class=\"bb_paragraph\">Aaah… The joy of seeing a Squeakross puzzle transform into a beautiful object is so satisfying! </p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/a3bfbd4275d77c09f1f6415a6d4ba5e709567bfe.avif\" width=\"616\" height=\"250\"><source src=\"https://hb-prd.imgix.net/product-media/1a2e6ad3f82bed74b4352d3600f7b778c8696636.mp4\" type=\"video/mp4\"></video></span><span class=\"bb_img_ctn\"><img class=\"bb_img\" src=\"https://hb-prd.imgix.net/product-media/016675f1bfc04e1f2f1d856ec40351a9da42271c.webp\" width=\"607\" height=\"55\"></span></p><p class=\"bb_paragraph\">Shape your rodent to your liking in the world's first <strong>Rodent Editor</strong> (we think??). From snout to tail, decide what kind of friend you want to have by your side! </p><p class=\"bb_paragraph\">Made for rodent lovers by rodent lovers, we made sure to offer <strong>plenty of options</strong> for you to be able to recreate your beloved pets in game.</p><p class=\"bb_paragraph\"><span class=\"bb_img_ctn\"><video class=\"bb_img\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" poster=\"https://hb-prd.imgix.net/product-media/6465d8e51132738c8f954410fd1938bfc9e3d3c0.avif\" width=\"650\" height=\"182\"><source src=\"https://hb-prd.imgix.net/product-media/66b3a3a81cdb3d3d12a3ceeefad04643ee3dca7d.mp4\" type=\"video/mp4\"></video></span></p><h2 class=\"bb_tag\">FEATURES:</h2><ul class=\"bb_ul\"><li><p class=\"bb_paragraph\">A Nonogram game like no other.</p></li><li><p class=\"bb_paragraph\">800+ puzzles to solve!</p></li><li><p class=\"bb_paragraph\">Relaxing puzzle-solving, with no time limit, mindful of new players.</p></li><li><p class=\"bb_paragraph\">Logic-Assist system that lets you preview possible solutions.</p></li><li><p class=\"bb_paragraph\">Decorate your home with hundreds of unique furniture.</p></li><li><p class=\"bb_paragraph\">Create and customize your own rodent with accessories.</p></li><li><p class=\"bb_paragraph\">Customize your user interface with unlockable stickers made by Eon.</p></li><li><p class=\"bb_paragraph\">Receive tips and lore from Nini, the owner of Home Squeak Home Inc.</p></li><li><p class=\"bb_paragraph\">\"Streamer mode\" to turn off Content ID tagged music</p></li></ul><p class=\"bb_paragraph\"></p><p class=\"bb_paragraph\"><i>Note: NO generative AI was used during the making of the game. We have a firm no-AI stance for ALL of our games, past, present and future.</i></p>\n7a:T42e,<p>Treat yourself to a month of IGN Plus! Includes perks like unlimited use of IGN’s in-game maps and guides, free games and even disabling ads across the site.</p><p><i><sub>Not available to active IGN Plus subscribers. By redeeming this offer, you are agreeing to IGN's terms and conditions, which is subject to change. Access to IGN Plus requires an IGN Plus account with a valid credit card on file. Depending on your jurisdiction, you may see a temporary hold applied to your payment method at time of redemption for the 30 day free access of IGN Plus. This is a temporary authorization charge from your bank that is not controlled by IGN; it will be removed from your bank transactions within a time frame dependent on your financial institution. No further action is needed on your part regarding the temporary hold. You will receive 30 days of access to IGN Plus, after the 30 days you will be charged the monthly rate. Offer only valid in regions where IGN Plus is available. You can manage your subscription at any time within your IGN account.</sub></i></p>\n18:[\"$\",\"$L71\",\"6ae5022eb541e3ca5f76f9c1\",{\"id\":\"6ae5022eb541e3ca5f76f9c1\",\"blockName\":\"Choice Carousel\",\"blockType\":\"choice-media-carousel\",\"header\":{\"title\":\"This Month's Games\",\"description\":{\"root\":{\"type\":\"root\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"Our game scouts chose these games we think you'll love - all of them yours to own forever! Join Humble Choice today and add this month's mix to your PC library.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":null,\"textStyle\":\"\",\"textFormat\":0}],\"direction\":null}},\"alignment\":\"center\"},\"subscriptionProducts\":[{\"id\":\"mafia_theoldcountry_choice\",\"productType\":\"humble-choice\",\"thumbnail\":\"https://hb-prd.imgix.net/product-media/cca60713fb56686b66f8e9dc1663b3241a832352.jpg\",\"title\":\"Mafia: The Old Country\",\"description\":\"$72\",\"url\":\"\",\"displayPrice\":{\"isSale\":false,\"currentPrice\":{\"type\":\"centPrecision\",\"currencyCode\":\"EUR\",\"centAmount\":6498.999999999999,\"fractionDigits\":2}},\"reviewScore\":\"$undefined\",\"genres\":\"$undefined\",\"deliveryMethods\":[\"steam\"],\"platforms\":[\"windows\"],\"developers\":[{\"name\":\"Hangar 13\"}],\"endDate\":\"2027-06-01T00:00:00+00:00\"},{\"id\":\"theouterw
