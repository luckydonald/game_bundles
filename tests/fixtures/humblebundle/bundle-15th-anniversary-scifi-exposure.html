<!DOCTYPE html><html><head></head><body><script>self.__next_f.push([1, "6e:T663,<p><strong>Sci-fi like you’ve never seen before.</strong> Celebrate 15 years of Humble Bundle with this collection of our favorite sci-fi games! In this bundle you’ll explore far-flung futures, survive hostile alien planets, and sink your teeth into intergalactic battles that feel realer than real. Get a piece of the action in <em>Marathon</em>, a first-person shooter set aboard a giant spaceship orbiting a colony in crisis! Resist an alien invasion and wage war against a technologically advanced enemy in the strategy game <em>Xenonauts 2</em>! Save the world from a corporate conspiracy in <em>Crysis 3 Remastered</em>! There are many more worlds and visions of the future to explore in this bundle, so grab these games now at the price of your choice and support Charity: water with your purchase!</p>\n<p><strong>Pay $10 or more.</strong> Normally, the total cost for the games in this bundle is as much as $375. Here at Humble Bundle, you choose the price and increase your contribution to upgrade your bundle! This bundle has a minimum $10 purchase. Pay $10 or more to access Steam keys.</p>\n<p><strong>Redeem on Steam.</strong> All of the games in this bundle are available on Steam. Please check out the full system requirements <a href=\"https://support.humblebundle.com/hc/en-us/articles/57160205438363-Humble-15th-Anniversary-Sci-Fi-Exposure-Bundle-System-Requirements\" rel=\"noopener\" target=\"_blank\">here</a> prior to purchasing.</p>\n<p><strong>Support charity.</strong> Choose where the money goes - between the publishers and to support Charity:water. If you like what we do, you can leave us a Humble Tip too!</p>\n6f:T777,Blood will run in the highly anticipated hardcore FPP slasher set one year after the events of Ghostrunner. Adventure through a post-apocalyptic cyberpunk future that takes place after the fall of the Keymaster, a tyrant who ruled over Dharma Tower, the last refuge of mankind. Jack is back to take on the violent AI cult that has assembled outside Dharma Tower and shape the future of humanity. <br><br>Featuring incredible katana combat mechanics, a deeper exploration of the world beyond Dharma Tower, nonlinear levels with complex motorbike sections, exciting new modes, and all the action you loved about Ghostrunner. Plus, boss fights are more interactive, giving players freedom to choose how to survive battles against the toughest opponents. <br><br><strong> Become The Ultimate Cyber Ninja </strong> <br><i>Ghostrunner 2</i> introduces new skills, allowing players to be more creative and take on even the most demanding encounters with greater accessibility. However, enemies in <i>Ghostrunner 2</i> behave uniquely dependent on the skills used against them, providing a fresh challenge with each encounter. The player progression system has been completely redone, providing opportunities to experiment and customize gameplay. <br><br><strong> Immersive, Mind-Bending Features </strong> <br>Master the Cybervoid if you hope to survive. Take on challenging, new enemies as you traverse interactive environments including exploding barrels, destructible walls, helpful neutral entities, and countless improvements that keep combat exciting and fresh. Can’t get enough? Dive even deeper into the lore and plot with the new dialogue system. <br><br><strong> Sounds of the Cybervoid </strong> <br>Save humanity in style as you decimate your opponents while listening to the captivating synthwave soundtrack featuring new music from Daniel Deluxe, We Are Magonia, Gost, Dan Terminus, and Arek Reikowski.\n70:T55a,Ghostrunner is a hardcore FPP slasher packed with lightning-fast action, set in a grim, cyberpunk megastructure. Climb Dharma Tower, humanity’s last shelter, after a world-ending cataclysm. Make your way up from the bottom to the top, confront the tyrannical Keymaster, and take your revenge.<br><br>The streets of this tower city are full of violence. Mara the Keymaster rules with an iron fist and little regard for human life.<br><br>As resources diminish, the strong prey on the weak and chaos threatens to consume what little order remains. The decisive last stand is coming. A final attempt to set things right before mankind goes over the edge of extinction.<br><br>As the most advanced blade fighter ever created, you’re always outnumbered but never outclassed. Slice your enemies with a monomolecular katana, dodge bullets with your superhuman reflexes, and employ a variety of specialized techniques to<br>prevail.<br><br>One-hit one-kill mechanics make combat fast and intense. Use your superior mobility (and frequent checkpoints!) to engage in a never-ending dance with death fearlessly.<br><br>Ghostrunner offers a unique single-player experience: fast-paced, violent combat, and an original setting that blends science fiction with post-apocalyptic themes. It tells the story of a world that has already ended and its inhabitants who fight to survive.\n71:T41c,Experience the single-player experience  from the iconic first-person shooter, Crysis 3, optimized to take advantage of today's hardware in <i>Crysis 3 Remastered</i>.\n<br>\n<br>\nIn <i>Crysis 3 Remastered</i>, the fate of the world is once again in your hands. Returning to the fight as super-soldier Prophet, wielding a powerful auto-loading Predator Bow that fires electric, explosive, and carbon arrows, take on new and old enemies that threaten the peace you worked so hard to achieve. The search for the alien Alpha Ceph continues, but now you must also expose the truth behind the C.E.L.L. corporation, which has turned New York City into a sprawling urban rainforest sheltered by a giant nanodome. Equipped with your legendary Nanosuit, you must assess, adapt, and attack as you choose your path and fight through seven distinct districts. Decimate your opponents in a blaze of brute force using the Nanosuit's superior technology, or use stealth to achieve your goals and become humanity's silent savior. There's no wrong way to save the world.\n\n72:T649,The classic first person shooter from Crytek is back with the action-packed gameplay, sandbox world, and thrilling epic battles you loved the first time around – now with remastered graphics optimized for a new generation of hardware.\n<br>\n<br>\nWhat begins as a simple rescue mission becomes the battleground of a new war as alien invaders swarm over a Lingshan island chain. Armed with a powerful Nanosuit, players can become invisible to stalk enemy patrols, or boost strength to lay waste to vehicles. The Nanosuit’s speed, strength, armor, and cloaking allow creative solutions for every kind of fight, while a huge arsenal of modular weaponry provides unprecedented control over play style. In the ever-changing environment, adapt tactics and gear to dominate your enemies, in an enormous sandbox world.\n<br>\n<br>\nSuit up: Your Nanosuit’s speed, strength, armor, and cloaking allow creative solutions for every kind of fight.\n<br>\n<br>\nAdapt: In an ever-changing environment, adapt your tactics to dominate on battlefields ranging from frozen jungle to alien environments.\n<br>\n<br>\nCustomize: A huge arsenal of modular weaponry provides unprecedented control over play style, with options ranging from the experimental to the alien.\n<br>\n<br>\nConquer: Life-like enemy AI requires a strategic and flexible playstyle, as new challenges – including a zero-g battlefield– require players to take the offensive and be proactive.\n<br>\n<br>\nExplore: Choose your own path through the open world of Crysis, destroying obstacles, driving vehicles, and using the environment itself against your enemies.\n\n73:Tc5b,<span> </span>\n<p>Infil into the dark sci-fi world of Tau Ceti IV: A derelict colony rife with rival Runners, hostile UESC security forces, and unpredictable environments. As you scavenge its zones for valuables with a crew or alone, tense moments of exploration break into fast-paced PvP combat where gunplay is responsive, supplies are finite, and preparation is rewarded.</p>\n<p>Exfil to advance your seasonal power, earn cosmetics for your achievements, and assemble stronger builds with your stolen loot. Then put your gear back on the line to seek even greater fortunes in your next run.</p>\n<strong class=\"hmb\">A GRAVEYARD OF POSSIBILITIES<br><br></strong>Trespass across deserted research facilities, rugged landscapes, and security outposts holding the remnants of a vanished expedition, yours to salvage. Tau Ceti threatens death at every turn with unique enemies, dynamic events, and environmental hazards. Each zone escalates in difficulty, preparing you for the UESC <i>Marathon</i> locked in the heavens.<br><strong class=\"hmb\"><br>POWERFUL. CONFIGURABLE. EXPENDABLE.<br><br></strong>Six equippable Runner shells offer diverse playstyle foundations to build upon, like Destroyer, Recon, and Thief. Scavenge an arsenal of moddable weapons, body implants, and core system upgrades to craft countless builds. Strategize as a crew each run to form comps that maximize your combined strengths, shaping the way you approach fights and objectives.<strong class=\"hmb\"><br><br>ENEMIES EVERYWHERE<br><br></strong>Face the unknown as a crew of two or three, or alone in solo lobbies. Or sneak into in-progress crew lobbies as Rook, a lone scavenger with no starting gear and nothing to lose. Forge uneasy alliances with rival Runners in prox chat to defeat mutual foes, but remember your new allies might revert to enemies just as quickly. Be merciless in combat: A lone survivor can reboot their crew, even from death.\n<p>Later in Season 1, compete in Rated mode to measure your skill and build a name for yourself.</p>\n<strong class=\"hmb\">INFLUENCE IS POWER<br><br></strong>Liaise with six competing factions, each offering lucrative incentives to advance their foothold on Tau Ceti. Completing faction contracts grows your baseline power via season-long unlocks like Runner shell upgrades, stronger starting loadouts, expanded vault space, and specialized wares on offer for spare loot.<strong class=\"hmb\"><br><br>DEFRAGMENT THE TRUTH<br><br></strong>No one knows what happened a century ago when the <i>Marathon</i> expedition went dark. As a trespasser into UESC territory, you are uniquely positioned to piece the story together. Unearth the skeletons of Tau Ceti’s past as you run deeper into the colony.<br><strong class=\"hmb\"><br>DEATH HANGS ABOVE<br><br></strong>Once the way into orbit unlocks, bring your endgame build to Cryo Archive, the first floor of the UESC <i>Marathon</i>. Solve raid-like security measures to unseal frozen vaults and pillage the artifacts within. Every cramped corridor forces you into conflict with fully-geared enemy crews racing for the same prize. Breach the seventh vault to challenge an entity even the UESC fears.\n74:T2181,<i>Xenonauts 2</i> is a strategy game that puts you in charge of a multinational military organization tasked with eliminating an extraterrestrial threat. Working from the shadows, you must seek out and engage the growing alien presence wherever it appears. Expand and manage a covert network of bases across the globe. Pursue research and development to bridge the technological gap with the alien invaders. Train, arm, and command your ground troops wherever the alien threat emerges. <br><br>It is 2009 - the Cold War continues, and the Berlin Wall still stands. In the shadows, a secret organization works beyond arbitrary political boundaries to gather information about a greater threat to humanity. Mysterious sightings of unidentified flying objects and unknown beings have grown more common, coinciding with escalating international tensions and panic. Those who report such sightings frequently disappear without a trace, and it is clear that the aliens grow bolder with each passing day. Time is of the essence. <br><br>Knowledge is power - unfortunately, little is known about the alien menace when you take charge. You will need to engage in combat operations around the globe to learn what you're up against. Eliminate extraterrestrial forces in deadly tactical battles to recover research samples, allowing your scientists to improve your equipment and slowly uncover the truth about the alien invasion. <br><br>\n<ul>\n<li>A massive variety of enemy types will keep you on your toes as you fight against a multitude of species, each with their own strengths, weaknesses, and fighting styles. Securing alien bodies to perform autopsies on will give you insights into their potential weaknesses, allowing you to prepare accordingly.</li>\n<li>Aliens aren't all you'll be fighting - human agents known as Cleaners work in tandem with the extraterrestrial threat, bringing with them added varieties of troops, combat locations, and mission objectives. The Cleaners work to further alien goals and objectives, operating directly under their influence - any strike against the Cleaners is an indirect strike against their alien overlords. You will have the opportunity to gather intel by infiltrating their bases, securing data, and seeing how far the conspiracy goes.</li>\n<li>Every combat engagement is an opportunity to learn more about the enemy force and how it fights - if you're willing to take the risk. Will you look to quickly eliminate active threats using explosives, grenades, and missiles, or will you take a more tempered approach to secure bodies and alien technology that can be taken back to HQ for autopsies and reverse-engineering? Will you focus on the development of airpower to bring down UFOs and investigate their crash sites for additional intel? Your adversary has the advantage in both technology and equipment – any choice you make will involve tradeoffs.</li>\n</ul>\nThe war against the alien force takes on a global scale - as they attack indiscriminately, your troops must be prepared to operate across the globe using multiple bases, taking time between operations to rest, recuperate, rearm, research, and eventually reengage the enemy. No two campaigns are the same as complex simulations ensure even the smallest variances in decisions will have far-reaching impacts across the entire game. <br><br>\n<ul>\n<li>A small radar station in Alaska detects an anomaly over the Bering Strait. Air Bases in Kamchatka and Yukon scramble jets to investigate, chasing multiple bogeys each, bringing them down over the water. Thousands of miles away, a radar station in Italy works in tandem with response teams stationed at a base in Algeria and an air base in France to take down alien operations on the Iberian Peninsula. Meanwhile, a new base is being built in Southeast Asia where the invaders have slipped through the cracks multiple times, inciting panic. Build, design, and manage multiple bases, each with its own squadrons of fighter jets and transports, radar arrays, research teams, operatives, and more. Consider the limitations of fuel ranges when you place them and use a grid-based construction system to optimally lay each of your bases out. Specialize your bases for detection, rapid response teams, research, manufacturing, and defenses as you see fit.</li>\n<li>Pursue multiple avenues of research to acquire a vast variety of aircraft, vehicles, weapons, armor, and other battlefield equipment to experiment with. Your approach on the battlefield will be determined by a combination of the terrain you're engaging in and what equipment you've chosen to bring to the field. The presence of mechanized combat platforms and vehicles can tilt many situations in your favor as they break through cover and deliver particularly devastating ordnance, though their use can come at the cost of the ability to procure valuable resources from intact alien bodies and equipment. The research tree is vast, with over one hundred projects to unlock, allowing you to take on the alien threat with your own personal strategic and tactical touches.</li>\n<li>Infuse alien technology across all manner of equipment, and even develop autonomous battlefield combat platforms and sentry guns to assist with your forward operations as well as the defense of your bases. If you give your engineering teams enough time, money, and resources, you'll find yourself well equipped for the threat - unfortunately, all three are perpetually scarce. Will you rush to produce automated combat platforms to minimize the threat to your operatives? Or produce additional dropships to respond to more threats at a time? Or will you seek improved armaments for your fighters to strengthen their ability to intercept and take down alien squadrons?</li>\n<li>Training centers you build at your bases allow soldiers to improve their combat capabilities during downtime, but actual combat experience is of course of unparalleled value. Each mission gives your operatives an opportunity to improve their abilities according to the actual actions they take in combat, and even earn medals for their deeds.</li>\n</ul>\nWhether fighting in the air or on the ground, your tactical prowess is put to the test when engaging alien attackers. Battles are extremely dangerous affairs, asking you to manage positioning, ammunition, lines of sight, cover, and much more besides - many of your operatives will get wounded, and many of them will die, but those that survive grow more experienced and are more capable of taking on future dangers. <br><br>\n<ul>\n<li>Scramble jets to respond to UFO sightings, engaging them in real-time tactical battles that put you in command of your fighter wings. Tell your pilots how to maneuver and who to target, ensuring their victory while also keeping an eye on their fuel gauge and the proximity of your nearby hangars. No forced 1-1 duals here – if the aliens bring a technologically advanced and heavily armed space craft to the fight, gang up and send a whole squadron of your best planes to bring it down. The strategic layer and air battles are closely intertwined, and careful planning of your global network of bases is of the utmost importance.</li>\n<li>Put boots on the ground by sending in your operatives for a variety of mission types, pursuing a range of objectives, but beware – your adversaries will not passively wait for you to discover them. Aliens will actively maneuver and seek you out from across the map, moving intelligently to strike at you from beyond visual range, hiding behind cover and taking advantage of the high ground. Maximize your chance of success through effective reconnaissance and lay ambush to eliminate the enemy.</li>\n<li>The battlefield is a dangerous place, and with an alien threat that will not stand idly by as you try to hunt them down, losses are inevitable. This isn’t the story of an elite squad of heroes winning battle after battle without loss – war is hell, and many of your troops will give their lives to resist the alien invasion. Your veteran troops will be invaluable, but even your basic recruits are skilled soldiers ready for combat. It is up to you to enable them to become the veterans of tomorrow.</li>\n</ul>\n<i>Xenonauts 2</i> is a standalone title that does not need any experience playing the original Xenonauts to follow the story or enjoy the gameplay experience. The punishing battles, in-depth strategic layer, and complex simulations will take fans of the series and newcomers alike through a dark and deadly story about the defense of Earth and all humankind.\ne:[[\"$\",\"section\",null,{\"className\":\"page-content mt-3 mb-6 lg:my-8 lg:px-8\",\"children\":[\"$\",\"$L6d\",null,{\"bundlePage\":{\"id\":\"b47b7c70-72f7-4bbe-adbb-3595e060325a\",\"slug\":\"15th-anniversary-scifi-exposure\",\"title\":\"Humble 15th Anniversary - Sci-Fi Exposure Bundle\",\"bundleType\":\"games\",\"bundleTypes\":[\"games\"],\"categories\":[],\"headline\":\"Sci-fi like you’ve never seen before\",\"description\":\"$undefined\",\"keyExpirationDate\":\"2027-05-12T04:00:00.000Z\",\"det
